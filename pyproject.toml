[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openalex-agent"
version = "0.1.0"
description = "Budgeted graph-guided academic literature discovery"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "networkx>=3.3,<4", "numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "python-dotenv>=1,<2", "tiktoken==0.14.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4.26,<5"]
ui = ["streamlit>=1.53,<2"]

[project.scripts]
openalex-agent = "openalex_agent.cli:main"

[tool.setuptools.packages.find]
include = ["openalex_agent*"]

[tool.setuptools.package-data]
openalex_agent = ["tokenizer_data/*", "_vendor/meta_clm/LICENSE", "_vendor/meta_clm/NOTICE", "_vendor/meta_clm/PROVENANCE.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
